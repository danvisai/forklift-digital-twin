[/Script/Engine.RendererSettings]
; Global illumination + reflections: Lumen (software ray tracing; needs mesh distance fields, on by
; default). This is what fills in shadowed areas - with GI off the scene looks dark and flat.
; If it is too heavy for the GPU, set both of these to 0 / 2 (none / screen-space) and expect darker shadows.
r.DynamicGlobalIlluminationMethod=1
r.ReflectionMethod=1
r.GenerateMeshDistanceFields=True
; Virtual shadow maps are the most expensive part of the default look; classic shadow maps are fine here.
r.Shadow.Virtual.Enable=0
r.Nanite.Foliage=True

[/Script/PhysicsCore.PhysicsSettingsCore]
DefaultGravityZ=-980.0
; The forklift is a chain of light jointed bodies (20-60 kg) hanging off an 1800 kg body; the default
; solver iteration counts leave those joints soft and the rear axle collapses. (These live in
; PhysicsCore's settings class, not Engine.PhysicsSettings.)
SolverOptions=(PositionIterations=24,VelocityIterations=8,ProjectionIterations=8)

